# ===========================================================================
# OptimCE Live Data — Mosquitto broker, PRODUCTION.
#
# Derived from the monorepo's mosquitto/config/mosquitto.conf. Everything that
# is not about the listeners is identical, for the same reasons; they are kept
# here because a production operator reads this copy, not that one.
#
# PINNED TO THE 2.1 LINE BY DIGEST in docker-compose.yml, and that pin is
# LOAD-BEARING rather than hygiene: `%u` substitution in dynamic-security ACLs
# arrived in Mosquitto 2.1.0 and does NOT exist in 2.0.x. On 2.0.x a `%u` ACL is
# a literal topic string, so a device can publish NOWHERE — and the failure is
# silent all the way down: the broker starts, the plugin loads, enrolment
# succeeds, and no telemetry ever arrives. Never move the pin back.
# ===========================================================================

per_listener_settings false
# dynsec is a GLOBAL plugin. Stated explicitly so that "the ACLs did nothing"
# can never be explained by per-listener security, and so that the TLS listener
# included at the end of this file inherits everything below.

# ---------------- listeners ----------------
#
# 1883, plaintext, NEVER PUBLISHED. docker-compose.yml publishes 8883 and nothing
# else, so this one is reachable only on the compose network `mqtt`: live-data
# (the dynsec control connection), live-data-worker (ingest) and mosquitto-roles.
# A published 1883 would put an authenticated-but-plaintext broker on the
# internet.
#
# The explicit 0.0.0.0 matters: a bare `listener 1883` binds to localhost INSIDE
# the container, and the other containers then get a bare "connection refused".
listener 1883 0.0.0.0
#
# 8883, TLS — the ONE listener a device reaches — is deliberately NOT in this
# file. It is /mosquitto/tls/listeners/tls.conf, included at the very end, and
# the `mosquitto-certs` one-shot writes it only when the Let's Encrypt
# certificate for the broker hostname exists (and removes it when it does not).
#
# That indirection is what keeps a missing certificate from taking the broker
# down: a `certfile` line here pointing at a file that is not there yet would
# stop Mosquitto from starting at all, which stops live-data and the ingest
# worker with it. This way the broker always starts, live-data's own connections
# work, and the device listener simply is not open until the certificate is —
# with mosquitto-certs saying so loudly in its log.

allow_anonymous false
# What makes every later "it connected" observation mean something.

max_packet_size 65536
# NOT `message_size_limit`, which 2.1 deprecates. Matches protocol §3.3's 64 KB
# cap. Enforced by DISCONNECTION, not rejection: a device whose batch exceeds it
# is dropped mid-publish and, if it retries the identical batch, never recovers —
# the symptom reads as "the device flaps", not "message too big".

# ---------------- dynamic security ----------------
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
# On the DATA volume, because the plugin REWRITES this file on every mutating
# control command. Anywhere uid 1883 cannot write, `createClient` succeeds in
# memory, reports success, and vanishes on the next restart.
#
# THE FILE MUST EXIST BEFORE THE BROKER STARTS. On 2.1.x a missing
# dynamic-security.json is not a startup error: the broker generates its own,
# with a `democlient`, a `super-admin` role, an `unauthenticated` group and a
# `.pw` file holding both passwords in PLAINTEXT, while looking perfectly
# healthy. `mosquitto-init` is ordered before this container for that reason.
#
# It holds every enrolled device's credential. Losing it means re-enrolling the
# whole fleet by hand, on devices with no keyboard: `mosquitto-backup` copies it
# into backups/ with the database dumps.

# ---------------- persistence ----------------
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
# On a NAMED VOLUME. The image runs as uid 1883; a bind mount is created
# root-owned, and Mosquitto logs an error and CARRIES ON — sessions then
# silently do not survive a restart.

autosave_interval 30
autosave_on_changes false
# The default is 1800 SECONDS. Mosquitto also saves on a clean SIGTERM, so at the
# default a `docker compose stop` test passes and a crash loses everything
# queued (measured in Phase 0: 0 of 5 queued messages survived a SIGKILL while
# the session itself did). `autosave_on_changes false` is what makes the 30
# above mean seconds rather than "every 30 changes".

# persistent_client_expiration  <-- DELIBERATELY ABSENT. Unset means NEVER.
# Setting it would purge the ingest worker's own session during exactly the long
# outage it exists to survive.

# ---------------- queueing ----------------
max_queued_messages 10000
max_queued_bytes 0
queue_qos0_messages false
max_inflight_messages 100
# Raised hard from the default of 1000: one worker outage across a real fleet
# exceeds that, and the broker then discards the excess with NO client-visible
# error — and it keeps the OLDEST and drops the NEWEST (measured), so a long
# outage loses the most recent data. The broker logs `Outgoing messages are
# being dropped for client <id>.` once per client.

# ---------------- observability ----------------
log_dest stdout
log_type all
# `all`, NOT `information`. An ACL denial is logged at DEBUG level, so at
# `information` it does not print AT ALL — and a denied publish is still
# PUBACKed, so the device sees success. This is the only place a refusal shows.
# The volume is bounded by the json-file rotation on the `mosquitto` service in
# docker-compose.yml.
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

# ---------------- the TLS device listener ----------------
# MUST stay the LAST line. Every *.conf in this directory is loaded here, in
# order; mosquitto-certs creates the directory on every run, so it exists even
# when it is empty (no certificate yet -> no device listener).
include_dir /mosquitto/tls/listeners

upstream crm-frontend {
    server crm-frontend:80;
}

upstream krakend {
    server krakend:8080;
}

upstream keycloak {
    server keycloak:8080;
}
upstream minio{
    server minio:9000;
}

map $http_upgrade $connection_upgrade {
    default "upgrade";
    '' "close";
}

server {
    listen 80;
    server_name app.optimce.be;
    location /.well-known/acme-challenge/ {
	root /var/www/certbot;
    }
    location / {
        proxy_pass http://crm-frontend;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_intercept_errors on;
        error_page 404 = @angular_spa_fallback;
    }

    location @angular_spa_fallback {
        if ($request_uri ~* "\.[A-Za-z0-9]{2,8}($|\?)") {
            return 404;
        }

        rewrite ^ /index.html break;
        proxy_pass http://crm-frontend;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
    }

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://krakend/;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    location = /keycloak {
        return 301 /keycloak/;
    }

    location /keycloak/ {
        proxy_pass http://keycloak;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "host=$host:$server_port;proto=$scheme";
    }

}

server {
    listen 80;
    server_name s3.optimce.be;
    location /.well-known/acme-challenge/ {
    	root /var/www/certbot;
    }
    location / {
        proxy_pass http://minio;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name app.optimce.be;

    ssl_certificate /etc/nginx/certs/live/app.optimce.be/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/app.optimce.be/privkey.pem;

    location / {
        proxy_pass http://crm-frontend;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_intercept_errors on;
        error_page 404 = @angular_spa_fallback;
    }

    location @angular_spa_fallback {
        if ($request_uri ~* "\.[A-Za-z0-9]{2,8}($|\?)") {
            return 404;
        }

        rewrite ^ /index.html break;
        proxy_pass http://crm-frontend;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
    }

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://krakend/;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    location = /keycloak {
        return 301 /keycloak/;
    }

    location /keycloak/ {
        proxy_pass http://keycloak;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "host=$host:$server_port;proto=$scheme";
    }
}

server {
    listen 443 ssl;
    server_name s3.optimce.be;

    ssl_certificate /etc/nginx/certs/live/app.optimce.be/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/app.optimce.be/privkey.pem;

    location / {
        proxy_pass http://minio;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

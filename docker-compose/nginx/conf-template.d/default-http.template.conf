upstream crm-backend {
    server ${CRM_BACKEND_UPSTREAM};
}

upstream crm-frontend {
    server ${CRM_FRONTEND_UPSTREAM};
}

upstream krakend {
    server ${KRAKEND_UPSTREAM};
}

upstream keycloak {
    server ${KEYCLOAK_UPSTREAM};
}
upstream minio{
    server ${MINIO_UPSTREAM};
}

map §http_upgrade §connection_upgrade {
    default "upgrade";
    '' "close";
}

# ---- Rate limit: the public live-data enrolment leg -------------------------
#
# http context, which is where a limit_req_zone must live - and this file IS
# http context: the `upstream` and `map` blocks above are http-only directives,
# and nginx's stock config includes conf.d/*.conf from inside `http { }`.
#
# THE SERVICE CANNOT DO THIS ITSELF. KrakenD's input-header allow-list excludes
# X-Forwarded-For and X-Real-IP, so behind the gateway every caller has the
# gateway's address. nginx is the only place in the chain that sees the real
# client IP. (A per-row attempt counter in the app would be useless anyway: a
# guessed token never finds a row to count against.)
#
# The RATE IS A LITERAL, unlike the development template's
# LIVE_ENROLL_RATE_LIMIT variable: an unset one would render `rate=;` and nginx
# would refuse to start, taking the whole site down over one endpoint. 6r/m per
# address plus the burst below is generous for a person enrolling a device and
# useless to a token-guessing loop.
limit_req_zone §binary_remote_addr zone=live_enroll:1m rate=6r/m;

# ---- Rate limit: the whole API, per client address -------------------------
#
# A coarse flood cap in front of the gateway, not a business quota. Per
# address: 10 requests a second on average, and up to 200 at once (the burst,
# on `location /api/` below). A literal, like the enrolment rate above.
#
# Sized on the development stack's access log (2026-11-28: two days of e2e
# runs, 39 496 /api/ requests, all from ONE address there). The busiest second
# held 55 requests, the busiest minute 364. Replayed through this zone, none is
# refused, and the busiest moment fills half the burst. A person in a browser
# sends far less: a page load is a few dozen calls, the pollers one every 4 s
# at most. The development templates carry the same numbers, so every e2e run
# tests them.
#
# Per ADDRESS: everyone behind one NAT shares a bucket. And it is only as good
# as the address nginx sees. If one address dominates the access log's first
# column (IPv6 clients forwarded by docker-proxy arrive with the Docker
# bridge's), this zone is one bucket for everybody: check before relying on it.
# Same reason as the enrolment zone: nginx is the only hop that sees the
# client's address, KrakenD gets nginx's.
#
# 10m holds about 160 000 addresses.
limit_req_zone §binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name ${DOMAIN_HOST};

    # Outer bound on request bodies, mirroring the annexes' RequestLimitsMiddleware:
    # 2 MB by default (MAX_BODY_BYTES), raised to 50 MB on /api/ where the multipart
    # upload endpoints live (UPLOAD_MAX_BODY_BYTES). nginx is the coarse gate; each
    # service still enforces its own precise per-route cap behind it.
    #
    # This MUST be set explicitly. nginx's implicit default is 1 MB, which rejects
    # every real upload with a 413 generated by nginx itself - a bare HTML error
    # page that never reaches the app, so it carries no error_code the frontend can
    # map to a message.
    client_max_body_size 2m;

    location / {
        proxy_pass ${CRM_FRONTEND_PROTOCOL}://crm-frontend;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
        proxy_set_header Upgrade §http_upgrade;
        proxy_set_header Connection §connection_upgrade;
        proxy_intercept_errors on;
        error_page 404 = @angular_spa_fallback;
    }

    location @angular_spa_fallback {
        # A missing *asset* must stay a 404 rather than be answered with the
        # index. Match §uri, not §request_uri: the latter carries the query
        # string, so a legitimate deep link ending in something extension-shaped
        # (?email=a@b.com, ?ref=https%3A%2F%2Fpartner.be) was being refused.
        if (§uri ~* "\.[A-Za-z0-9]{2,8}§") {
            return 404;
        }

        rewrite ^ /index.html break;
        proxy_pass ${CRM_FRONTEND_PROTOCOL}://crm-frontend;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
    }

    # -- Realtime SSE: the ONE path that bypasses the API gateway ------------
    # Bypassed for two independent reasons: EventSource cannot send an
    # Authorization header (so KrakenD's auth/validator can never be satisfied),
    # and KrakenD buffers + JSON-decodes with a 3000ms global timeout. Authority
    # is minted BEHIND the gateway by POST /api/notifications/realtime/ticket;
    # this location carries none of its own.
    #
    # EXACT match (`=`), never a prefix, and `proxy_pass` deliberately carries NO
    # URI path. crm-backend performs NO authentication - it trusts x-user-id
    # blindly - so anything reachable here other than the ticket-authenticated
    # stream handler is an unauthenticated, cross-tenant API. Writing
    # `location /realtime/` or `proxy_pass ...://crm-backend/;` (trailing slash)
    # would map /realtime/me/members onto an unauthenticated GET /me/members.
    # That single character is the difference between this and a full breach.
    location = ${WEB_REALTIME_PATH} {
        proxy_pass ${CRM_BACKEND_PROTOCOL}://crm-backend;
        include /etc/nginx/conf.d/proxy-common-headers.conf;

        # The gateway-trust headers are FORGEABLE on this leg. An empty value
        # makes nginx DROP the header entirely, so the handler cannot read one
        # even by accident. The single-use ticket in ?t= is the only credential.
        proxy_set_header X-User-Id "";
        proxy_set_header X-Community-Id "";
        proxy_set_header X-User-Groups "";
        proxy_set_header X-User-Orgs "";
        proxy_set_header X-Source-Ip "";

        # proxy-common-headers.conf sets proxy_http_version 1.1 but not
        # Connection, and the default `close` is fine for a stream.
        proxy_set_header Connection "";

        # proxy_buffering off is the load-bearing directive; the app also sends
        # X-Accel-Buffering: no as a backstop. Do NOT add
        # chunked_transfer_encoding off - wrong for a body of unknown length.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # The single-use ticket travels in the query string, because EventSource
        # cannot set headers. Keep it out of the access log. NOTE: nginx still
        # writes the full request line to error_log on an upstream failure (e.g.
        # while crm-backend restarts) - accepted, because the ticket is dead
        # within 30s and is single-use.
        access_log off;
    }

    # ---- The platform's ONLY unauthenticated API endpoint ------------------
    #
    # live-data's device enrolment. `auth: false` on the `live-public` KrakenD
    # entry removes the PRODUCER of the x-user-* headers. It does NOT remove them
    # from the request: `input_headers` is global in the generator with no
    # per-service override, so a client-supplied x-user-id would be forwarded
    # verbatim - and removing it there would strip it from every authenticated
    # endpoint too. So this location is the only thing standing between a forged
    # header and live-data's GatewayScopeMiddleware, which reads those headers on
    # EVERY request, this one included.
    #
    # EXACT match (`=`), never a prefix: `location /api/live-public/` would cover
    # anything later added under that namespace, unauthenticated, by default.
    location = /api/live-public/enroll {
        # An EXPLICIT URI on proxy_pass. The `/api/` block below relies on a
        # trailing slash to strip the prefix, and an `=` location does NOT
        # inherit that rewrite - without the path spelled out here, KrakenD
        # receives /api/live-public/enroll and 404s, which reads as a gateway
        # misconfiguration rather than as a proxy one.
        proxy_pass ${KRAKEND_PROTOCOL}://krakend/live-public/enroll;
        include /etc/nginx/conf.d/proxy-common-headers.conf;

        # The same five the SSE leg blanks, for the same reason: an EMPTY value
        # makes nginx DROP the header entirely. The single-use enrolment token in
        # the body is the only credential on this leg.
        proxy_set_header X-User-Id "";
        proxy_set_header X-Community-Id "";
        proxy_set_header X-User-Groups "";
        proxy_set_header X-User-Orgs "";
        proxy_set_header X-Source-Ip "";

        # burst, and nodelay. Without a burst one enrolment retry trips the limit;
        # without nodelay the excess is QUEUED rather than refused, which turns a
        # rate limit into latency inside a request KrakenD cuts at 3000 ms.
        limit_req zone=live_enroll burst=5 nodelay;

        # The body is a token and a connector name. The 50m on /api/ is for the
        # upload endpoints and has no business here: a public endpoint that
        # accepts 50 MB is a memory-exhaustion lever anyone can pull.
        client_max_body_size 4k;
    }

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass ${KRAKEND_PROTOCOL}://krakend/;
        include /etc/nginx/conf.d/proxy-common-headers.conf;

        # The upload endpoints behind the gateway (allocation + simulation key
        # generation, news-board, administrative-document) accept bodies up to
        # UPLOAD_MAX_BODY_BYTES = 50 MB. Keep these two numbers in step.
        client_max_body_size 50m;
        proxy_set_header X-Forwarded-Host §host;
        proxy_set_header X-Forwarded-Port §server_port;
        proxy_set_header X-Forwarded-Prefix /api;

        # Headers only nginx or the gateway may set (the signature annexe's
        # step-up and evidence, 2026-11-03). KrakenD fills x-auth-* from the
        # validated token (propagate_claims: auth_time, sid, acr); a token
        # without the claim must not let a client-supplied value through, so
        # blank them here (an EMPTY value makes nginx drop the header). A forged
        # x-auth-time would otherwise pass the "recent login" check of a sign
        # call. x-source-ip is the client's address as nginx sees it, recorded
        # in the signature evidence: set here, never taken from the client.
        proxy_set_header X-Auth-Time "";
        proxy_set_header X-Auth-Sid "";
        proxy_set_header X-Auth-Acr "";
        proxy_set_header X-Source-Ip §remote_addr;

        # The API's flood cap (zone `api`, at the top of this file).
        # nodelay: the excess is refused at once instead of queued, which would
        # turn the limit into latency inside requests KrakenD cuts at 3000 ms.
        # 429 instead of nginx's default 503: the SPA's ServiceBase retries a 5xx
        # twice and never a 4xx, so a 503 would triple the refused traffic.
        # Set here, not in the http context, so the enrolment leg keeps its own.
        # The realtime stream and /api/live-public/enroll are exact-match
        # locations of their own: this limit does not count them.
        limit_req zone=api burst=200 nodelay;
        limit_req_status 429;
    }

    location = /keycloak {
        return 301 /keycloak/;
    }

    location /keycloak/ {
        proxy_pass ${KEYCLOAK_PROTOCOL}://keycloak;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
        proxy_set_header X-Forwarded-Host §host;
        proxy_set_header X-Forwarded-Port §server_port;
        proxy_set_header Forwarded "host=§host:§server_port;proto=§scheme";
    }

}

server {
    listen 80;
    server_name ~^s3\.;

    location / {
        proxy_pass ${MINIO_PROTOCOL}://minio;
        include /etc/nginx/conf.d/proxy-common-headers.conf;
        proxy_set_header X-Forwarded-Host §host;
        proxy_set_header X-Forwarded-Proto §scheme;
    }
}

# The MQTT broker's hostname (LIVE_DATA_BROKER_PUBLIC_HOST, mqtt.<domain>). Port
# 80 answers ONLY its ACME HTTP-01 challenge, so that `./docker-stack.sh
# mqtt-cert` and `renew-certs` can prove control of the name. MQTT itself never
# passes through nginx: TLS terminates in Mosquitto, on 8883. Needed here even
# without HTTPS for the web: the broker's certificate is required regardless,
# and the first server above proxies everything to the frontend.
#
# A wildcard and not the LIVE_DATA_BROKER_PUBLIC_HOST variable, on purpose: an
# empty one would render `server_name ;` and stop the reverse proxy. (Comments
# here go through envsubst too, hence no dollar-brace names in them.)
server {
    listen 80;
    server_name mqtt.*;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 404;
    }
}
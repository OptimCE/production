      - database
      - billing
      - nats
      - minio
      - opentelemetry
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # Start docgen first so its DOCGEN_RESULTS stream usually exists before we
      # subscribe. The background subscribe-retry in worker/dispatcher.py is the
      # real guarantee, but it gives up after ~20 min and then silently disables
      # PDF attach for the lifetime of the process.
      document-generation:
        condition: service_started

  administrative-document:
    profiles: ["backend"]
    image: ghcr.io/optimce/administrative-document:main-prod
    restart: unless-stopped
    environment:
      - ENV=production
      - CRM_DATABASE_URL=postgresql+asyncpg://administrative_document_svc:${ADMINISTRATIVE_DOCUMENT_DB_PASSWORD}@postgres:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://administrative_document_svc:${ADMINISTRATIVE_DOCUMENT_DB_PASSWORD}@postgres:5432/administrative_document_local
      - CRM_DB_POOL_SIZE=5
      - CRM_DB_MAX_OVERFLOW=5
      - LOCAL_DB_POOL_SIZE=5
      - LOCAL_DB_MAX_OVERFLOW=5
      - NATS_URL=nats://nats:4222
      # ENV=production rejects a wildcard origin at startup, so this must be the
      # real origin and never the `*` the dev stack uses.
      - ALLOW_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      # Stored document versions share the platform document bucket, under this
      # service's own key prefix.
      - OUTPUT_BUCKET=${OUTPUT_BUCKET}
      # Declared but never opened by this service: document_template.file_ref
      # points into it and document-generation fetches the bundle. Named here so
      # a misconfigured stack fails at boot rather than at first render.
      - TEMPLATES_BUCKET=${TEMPLATES_BUCKET}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - STORAGE_REGION=us-east-1
      # Must match the worker's. document-generation's DOCGEN_RESULTS stream
      # filters on `docgen.result.>`, so this subject needs no stream change.
      - DOCGEN_REQUEST_SUBJECT=docgen.request
      - DOCGEN_RESULT_SUBJECT=docgen.result.administrative_document
      # Maps community.regulator -> the region whose deadline rules apply.
      - REGULATORS_CONFIG_PATH=/app/reference/regulators.json
      - LOGGING_TOKEN=${LOGGING_TOKEN}
      - LOGGING_TRACES_URL=${LOGGING_TRACES_URL}
      - LOGGING_LOGS_URL=${LOGGING_LOGS_URL}
      - LOGGING_METRICS_URL=${LOGGING_METRICS_URL}
    volumes:
      - ./reference:/app/reference:ro
    networks:
      - api-gateway
      - crm
      - database
      - nats
      - minio
      - opentelemetry
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  administrative-document-worker:
    profiles: ["backend"]
    image: ghcr.io/optimce/administrative-document:main-worker
    restart: unless-stopped
    environment:
      - ENV=production
      - CRM_DATABASE_URL=postgresql+asyncpg://administrative_document_svc:${ADMINISTRATIVE_DOCUMENT_DB_PASSWORD}@postgres:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://administrative_document_svc:${ADMINISTRATIVE_DOCUMENT_DB_PASSWORD}@postgres:5432/administrative_document_local
      - CRM_DB_POOL_SIZE=5
      - CRM_DB_MAX_OVERFLOW=5
      - LOCAL_DB_POOL_SIZE=5
      - LOCAL_DB_MAX_OVERFLOW=5
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - OUTPUT_BUCKET=${OUTPUT_BUCKET}
      - TEMPLATES_BUCKET=${TEMPLATES_BUCKET}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - STORAGE_REGION=us-east-1
      - DOCGEN_REQUEST_SUBJECT=docgen.request
      - DOCGEN_RESULT_SUBJECT=docgen.result.administrative_document
      - REGULATORS_CONFIG_PATH=/app/reference/regulators.json
      - LOGGING_TOKEN=${LOGGING_TOKEN}
      - LOGGING_TRACES_URL=${LOGGING_TRACES_URL}
      - LOGGING_LOGS_URL=${LOGGING_LOGS_URL}
      - LOGGING_METRICS_URL=${LOGGING_METRICS_URL}
    volumes:
      - ./reference:/app/reference:ro
    networks:
      - crm
      - database
      - nats
      - minio
      - opentelemetry
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # The API declares the ADMIN_DOCUMENT work-queue stream this worker
      # consumes from, so without it the first subscribe fails.
      administrative-document:
        condition: service_started
      # And docgen, so its DOCGEN_RESULTS stream usually exists before we bind
      # to it. The background subscribe-retry is the real guarantee.
      document-generation:
        condition: service_started

  # The only thing in the platform that sends email. Worker-only, like
  # document-generation: no port, no gateway route, no OpenAPI export — sending
  # is purely outbound, so there is nothing to listen on. It owns no database
  # either; the outbound_message queue lives in the CRM schema so that a
  # producer's enqueue rides on its own transaction.
  #
  # REQUIRES a CRM schema carrying notification / outbound_message /
  # email_suppression / notification_preference. Those arrive via the migration
  # profile, not from this repo — see DATABASE_CONSOLIDATION.md.
  notification-dispatch:
    profiles: ["backend"]
    image: ghcr.io/optimce/notification-dispatch:main-worker
    restart: unless-stopped
    environment:
      - ENV=production
      - CRM_DATABASE_URL=postgresql+asyncpg://notification_dispatch_svc:${NOTIFICATION_DISPATCH_DB_PASSWORD}@postgres:5432/crm_db
      - CRM_DB_POOL_SIZE=5
      - CRM_DB_MAX_OVERFLOW=5
      # SMTP or BREVO. The image default is NOOP, which is REFUSED outside
      # local/test precisely because it would mark every message SENT while no
      # mail left the building — so this must be set explicitly.
      - EMAIL_TRANSPORT=${EMAIL_TRANSPORT}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME}
      - EMAIL_REPLY_TO=${EMAIL_REPLY_TO}
      - EMAIL_MESSAGE_ID_DOMAIN=${EMAIL_MESSAGE_ID_DOMAIN}
      # Link base for the emails themselves.
      - APP_URL=${DOMAIN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_STARTTLS=${SMTP_STARTTLS}
      - SMTP_TLS=${SMTP_TLS}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_BASE_URL=${BREVO_BASE_URL}
      - DISPATCH_POLL_INTERVAL_SECONDS=${DISPATCH_POLL_INTERVAL_SECONDS}
      - DEFAULT_LOCALE=${EMAIL_DEFAULT_LOCALE}
      - LOGGING_TOKEN=${LOGGING_TOKEN}
      - LOGGING_TRACES_URL=${LOGGING_TRACES_URL}
      - LOGGING_LOGS_URL=${LOGGING_LOGS_URL}
      - LOGGING_METRICS_URL=${LOGGING_METRICS_URL}
    networks:
      # Reaching the SMTP relay or the Brevo API needs no extra network: a
      # container on any bridge network already has outbound access.
      - database
      - opentelemetry
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully

  # ============================================
  # MIGRATION PROFILE - CRM schema migrations
  # ============================================
  # Runs as crm_svc, NOT as the superuser. That is deliberate: ALTER DEFAULT
  # PRIVILEGES in postgres/provision/30-crm-grants.sql applies only to objects
  # created by crm_svc, so a table this image creates as `postgres` would arrive
  # with no SELECT grant for any annexe — and the symptom is a
  # "no privileges were granted for ..." WARNING, not an error.
  #
  # If a migrator release ever genuinely needs superuser, run it as `postgres`
  # and then repair with postgres/provision/91-reown-crm.sql followed by another
  # postgres-init run. See DATABASE_CONSOLIDATION.md.
  optimce-migrator:
    profiles: ["migration"]
    image: ghcr.io/optimce/migrator:main
    restart: "no"
    # ONE URL PER DATABASE REGISTERED IN THE IMAGE'S database.config, or the run
    # fails before touching anything: the migrator walks its whole config and
    # raises on the first env var it cannot resolve. The error reads
    # "configuration error: environment variable 'X' is not set" and does not
    # mention this file. If a migrator release adds a database, it must be added
    # here in the same deploy — or scope the run with `--database <name>`.
    #
    # Each connects as that database's OWNING role, so objects a migration
    # creates are owned by the role ALTER DEFAULT PRIVILEGES is attached to.
    environment:
      - OPTIMCE_CRM_DATABASE_URL=postgresql+asyncpg://crm_svc:${CRM_DB_PASSWORD}@postgres:5432/crm_db
      - OPTIMCE_BILLING_DATABASE_URL=postgresql+asyncpg://billing_svc:${BILLING_DB_PASSWORD}@postgres:5432/billing_local
      - OPTIMCE_ADMINISTRATIVE_DOCUMENT_DATABASE_URL=postgresql+asyncpg://administrative_document_svc:${ADMINISTRATIVE_DOCUMENT_DB_PASSWORD}@postgres:5432/administrative_document_local
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully

  # ============================================
  # FRONTEND PROFILE - Web serving
  # ============================================
  reverse-proxy:
    profiles: ["frontend"]
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
      # ACME HTTP-01 challenge root. certbot writes tokens to /webroot (same host
      # dir); the nginx templates serve them from /var/www/certbot. Without this
      # mount every renewal 404s and the certificate silently expires.
      - ./nginx/certbot-webroot:/var/www/certbot
    networks:
      - reverse-proxy
      - minio
      - api-gateway
      - keycloak
      - crm

  certbot:
    profiles: ["frontend"]
    image: certbot/certbot:latest
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/certbot-webroot:/webroot
    command: certonly --webroot -w /webroot -d ${DOMAIN_HOST} --agree-tos -m ${SSL_EMAIL} --non-interactive
    environment:
      - DOMAIN_HOST=${DOMAIN_HOST}
      - SSL_EMAIL=${SSL_EMAIL}

  crm-frontend:
    profiles: ["frontend"]
    image: ghcr.io/optimce/crm-frontend:main
    volumes:
      - ./crm-frontend-config/config.json:/usr/share/nginx/html/assets/config/config.json
    networks:
      - reverse-proxy

  # ============================================
  # BACKUP PROFILE - Database backups
  # ============================================
  # One job for the whole instance. Dumps each database into the same filename
  # pattern the six per-database jobs used, so existing backups and restore
  # habits keep working, plus the cluster globals.
  #
  # The globals dump is not optional now: role definitions and their password
  # hashes live in the instance, not in any single database. A set of per-database
  # dumps without it cannot rebuild a working cluster.
  #
  # `$$(...)` is the compose escape for "evaluate this in the container, not on
  # the host". A failure on one database does not abort the rest — one broken
  # annexe must not be able to block a shutdown.
  db-backup:
    profiles: ["backup"]
    image: postgres:18-alpine@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
    volumes:
      - ./backups:/backups
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=${POSTGRES_SUPERUSER_PASSWORD}
    command: >
      sh -c '
        TS=$$(date +%Y%m%d_%H%M%S) ;
        rc=0 ;
        pg_dumpall --globals-only -f /backups/globals_$$TS.sql || rc=1 ;
        for pair in crm_db:crm_db allocation_key_local:allocation_key simulation_key_local:simulation_key news_board_local:news_board billing_local:billing administrative_document_local:administrative_document ; do
          db=$${pair%%:*} ; name=$${pair##*:} ;
          echo "dumping $$db" ;
          pg_dump -d "$$db" -f "/backups/$${name}_$$TS.sql" || { echo "$$db FAILED" ; rc=1 ; } ;
        done ;
        exit $$rc ;
      '
    networks:
      - database

  keycloak-db-backup:
    profiles: ["backup"]
    image: postgres:18-alpine
    volumes:
      - ./backups:/backups
    environment:
      - PGPASSWORD=${KEYCLOAK_DB_PASSWORD}
    command: >
      sh -c '
        pg_dump -h keycloak-db -U postgres -d keycloak -f /backups/keycloak_$(date +%Y%m%d_%H%M%S).sql ;
      '
    networks:
      - keycloak

volumes:
  # The unified application instance.
  postgres_data:
  keycloak_db_data:

  # ---------------------------------------------------------------------------
  # PRE-CONSOLIDATION DATA. Retained deliberately, not leftovers.
  #
  # These six volumes hold the databases as they were before the consolidation.
  # They are the rollback: `git checkout <previous-commit>` restores the six
  # per-database services, which find their data exactly where they left it.
  #
  # While the rollback window is open, do NOT run `docker compose down -v` and do
  # NOT run `docker volume prune`. Remove these declarations in a follow-up
  # commit once the window closes and the volumes have had a final snapshot.
  # See DATABASE_CONSOLIDATION.md §8.
  # ---------------------------------------------------------------------------
  crm_db_data:
  allocation_key_db_data:
  simulation_key_db_data:
  news_board_db_data:
  billing_db_data:

  minio_data:
  nats_data:
  krakend_config:
  keycloak_data:

networks:
  reverse-proxy:
  api-gateway:
  # Everything that speaks to the unified Postgres instance. `keycloak-db` is
  # NOT here — it stays on `keycloak`, which is what leaves these five roles with
  # no route to it.
  database:
  crm:
  keycloak:
  # allocation-key / simulation-key / news-board / billing carried this stack's
  # database traffic before the consolidation. They now link each annexe API to
  # its own worker and nothing else. Left in place on purpose: pruning them is a
  # separate change, and a database migration window is the wrong place to also
  # rewire the network topology.
  allocation-key:
  simulation-key:
  news-board:
  billing:
  nats:
  minio:
  opentelemetry:

      postgres-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  billing-worker:
    profiles: ["backend"]
    image: ghcr.io/optimce/billing:main-worker
    restart: unless-stopped
    environment:
      - ENV=production
      - CRM_DATABASE_URL=postgresql+asyncpg://billing_svc:${BILLING_DB_PASSWORD}@postgres:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://billing_svc:${BILLING_DB_PASSWORD}@postgres:5432/billing_local
      - CRM_DB_POOL_SIZE=5
      - CRM_DB_MAX_OVERFLOW=5
      - LOCAL_DB_POOL_SIZE=5
      - LOCAL_DB_MAX_OVERFLOW=5
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - TEMPLATES_BUCKET=${TEMPLATES_BUCKET}
      - OUTPUT_BUCKET=${OUTPUT_BUCKET}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - STORAGE_REGION=us-east-1
      - REGULATORS_CONFIG_PATH=/app/reference/regulators.json
      - DEFAULT_LOCALE=fr-BE
      - LOGGING_TOKEN=${LOGGING_TOKEN}
      - LOGGING_TRACES_URL=${LOGGING_TRACES_URL}
      - LOGGING_LOGS_URL=${LOGGING_LOGS_URL}
      - LOGGING_METRICS_URL=${LOGGING_METRICS_URL}
    volumes:

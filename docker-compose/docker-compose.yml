services:
  # ============================================
  # INIT PROFILE - Configuration generation
  # ============================================
  swagger-doc-gen:
    profiles: ["init"]
    image: alpine/curl:latest
    command:
      - "-fL"
      - "https://optimce.github.io/crm-backend/swagger.yml"
      - "-o"
      - "/data/root.yaml"
    volumes:
      - ./krakend_config:/data:z
    restart: on-failure

  generation-doc-gen:
    profiles: ["init"]
    image: alpine/curl:latest
    command:
      - "-fL"
      - "https://optimce.github.io/allocation-key-generation/swagger.yml"
      - "-o"
      - "/data/generation.json"
    volumes:
      - ./krakend_config:/data:z
    restart: on-failure

  simulation-doc-gen:
    profiles: ["init"]
    image: alpine/curl:latest
    command:
      - "-fL"
      - "https://optimce.github.io/allocation-key-simulation/swagger.yml"
      - "-o"
      - "/data/simulation.json"
    volumes:
      - ./krakend_config:/data:z
    restart: on-failure

  news-board-doc-gen:
    profiles: ["init"]
    image: alpine/curl:latest
    command:
      - "-fL"
      - "https://optimce.github.io/news-board/swagger.yml"
      - "-o"
      - "/data/news-board.json"
    volumes:
      - ./krakend_config:/data:z
    restart: on-failure

  billing-doc-gen:
    profiles: ["init"]
    image: alpine/curl:latest
    command:
      - "-fL"
      - "https://optimce.github.io/billing/swagger.yml"
      - "-o"
      - "/data/billing.json"
    volumes:
      - ./krakend_config:/data:z
    restart: on-failure

  krakend-config:
    profiles: ["init"]
    image: ghcr.io/optimce/swagger2krakend:main
    volumes:
      - ./krakend_config:/config
    environment:
      - CONFIG_FILE=/config/krakend-builder.yaml
      - OUTPUT_FILE=/config/krakend.json
      - KEYCLOAK_URL=${AUTH_INTERNAL_URL}
      - REALM_NAME=${AUTH_REALM}
      - ISSUER=${DOMAIN}${WEB_AUTH_URL}/realms/${AUTH_REALM}
    restart: on-failure
    depends_on:
      swagger-doc-gen:
        condition: service_completed_successfully
      generation-doc-gen:
        condition: service_completed_successfully
      simulation-doc-gen:
        condition: service_completed_successfully
      news-board-doc-gen:
        condition: service_completed_successfully
      billing-doc-gen:
        condition: service_completed_successfully

  keycloak-config:
    profiles: ["init"]
    image: ghcr.io/ourouk/alpine-envsubst:main
    env_file:
      - .env
    volumes:
      - ./keycloak/realm:/config
    command:
      - < /config/prod-config.template.json > /config/prod-config.json

  nginx-config:
    profiles: ["init"]
    image: ghcr.io/ourouk/alpine-envsubst:main
    env_file:
      - .env
    volumes:
      - ./nginx/conf-template.d:/config
      - ./nginx/conf.d:/output
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        if [ "${USE_HTTPS}" = "true" ]; then
          cp /config/default-https.template.conf /tmp/template.conf;
        else
          cp /config/default-http.template.conf /tmp/template.conf;
        fi
        envsubst < /tmp/template.conf | sed 's/§/$/g' > /output/default.conf

  crm-frontend-config:
    profiles: ["init"]
    image: ghcr.io/ourouk/alpine-envsubst:main
    env_file:
      - .env
    volumes:
      - ./crm-frontend-config:/config
    command:
      - < /config/config.template.json > /config/config.json


  keycloak-group-id-mapper:
    profiles: ["init"]
    image: alpine/curl:latest
    command:
      - "-fL"
      - "https://github.com/OptimCE/kc-groupid-mapper/releases/download/v0.0.1/kc-groupid-mapper-1.0.0.jar"
      - "-o"
      - "/data/kc-groupid-mapper-1.0.0.jar"
    volumes:
      - ./keycloak/providers:/data:z
    restart: on-failure

  keycloak-optimce-theme:
    profiles: ["init"]
    image: alpine:3.20
    entrypoint: /bin/sh
    working_dir: /data
    volumes:
      - ./keycloak/providers:/data:z
    command:
      - "-c"
      - |
        set -eu
        apk add --no-cache curl unzip zip >/dev/null
        WORK=$$(mktemp -d)
        JAR=/data/keycloak-theme-for-kc-all-other-versions.jar
        curl -fsSL \
          https://github.com/OptimCE/optimce-keycloak-theme/releases/download/v0.0.3/keycloak-theme-for-kc-all-other-versions.jar \
          -o "$$WORK/src.jar"
        mkdir -p "$$WORK/unpacked"
        cd "$$WORK/unpacked"
        unzip -o "$$WORK/src.jar" >/dev/null
        if [ -d theme/keycloakify-starter ] && [ ! -d theme/optimce ]; then
          mv theme/keycloakify-starter theme/optimce
        fi
        mkdir -p META-INF
        echo '{"themes":[{"name":"optimce","types":["login"]}]}' > META-INF/keycloak-themes.json
        rm -f "$$JAR"
        zip -r "$$JAR" META-INF theme >/dev/null
        rm -rf "$$WORK"
    restart: on-failure
  # ============================================
  # BACKEND PROFILE - Databases and runtime
  # ============================================
  crm-database:
    profiles: ["backend"]
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=crm_db
      - POSTGRES_PASSWORD=${CRM_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - crm_db_data:/var/lib/postgresql/data
      - ./crm-backend-db/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - crm
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  keycloak-db:
    profiles: ["backend"]
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - keycloak
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  allocation-key-db:
    profiles: ["backend"]
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=allocation_key_local
      - POSTGRES_PASSWORD=${ALLOCATION_KEY_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - allocation_key_db_data:/var/lib/postgresql/data
      - ./allocation-key-db/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - allocation-key
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  simulation-key-db:
    profiles: ["backend"]
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=simulation_key_local
      - POSTGRES_PASSWORD=${SIMULATION_KEY_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - simulation_key_db_data:/var/lib/postgresql/data
      - ./simulation-key-db/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - simulation-key
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  news-board-db:
    profiles: ["backend"]
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=news_board_local
      - POSTGRES_PASSWORD=${NEWS_BOARD_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - news_board_db_data:/var/lib/postgresql/data
      - ./news-board-db/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - news-board
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  billing-db:
    profiles: ["backend"]
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=billing_local
      - POSTGRES_PASSWORD=${BILLING_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - billing_db_data:/var/lib/postgresql/data
      - ./billing-db/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - billing
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nats:
    profiles: ["backend"]
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222", "-sd", "/data"]
    volumes:
      - nats_data:/data
    networks:
      - nats
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - 'http://localhost:8222/healthz?js-enabled-only=true' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  keycloak:
    profiles: ["backend"]
    image: quay.io/keycloak/keycloak:26.5.5@sha256:a7b0cb7a43a1235a61872883414d3f1d9a3ceac9df6e5907bd12202778a6265c
    restart: unless-stopped
    command:
      - "start"
      - "--import-realm"
      - "--health-enabled=true"
      - "--metrics-enabled=true"
      - "--proxy-headers=xforwarded"
      - "--http-relative-path=/keycloak"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      - KEYCLOAK_IMPORT=/opt/keycloak/data/import/prod-config.json
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_HOSTNAME=${KEYCLOAK_HOSTNAME}
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    volumes:
      - ./keycloak/realm/prod-config.json:/opt/keycloak/data/import/prod-config.json
      - ./keycloak/providers:/opt/keycloak/providers/
    networks:
      - keycloak
      - api-gateway
      - reverse-proxy
    depends_on:
      keycloak-db:
        condition: service_healthy



  keycloak-healthcheck:
    profiles: ["backend"]
    image: alpine/curl
    command: ["tail", "-f", "/dev/null"]
    networks:
      - keycloak
    depends_on:
      - keycloak
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --head -fsS http://keycloak:9000/keycloak/health/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  minio:
    profiles: ["backend"]
    image: pgsty/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_SERVER_ADDRESS=:9000
    volumes:
      - minio_data:/data
    networks:
      - reverse-proxy
      - minio
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    profiles: ["backend"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - TEMPLATES_BUCKET=${TEMPLATES_BUCKET}
      - OUTPUT_BUCKET=${OUTPUT_BUCKET}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${STORAGE_BUCKET};
      mc mb --ignore-existing local/$${TEMPLATES_BUCKET};
      mc mb --ignore-existing local/$${OUTPUT_BUCKET};
      mc cp --recursive /templates/billing local/$${TEMPLATES_BUCKET}/;
      exit 0;
      "
    volumes:
      - ./document-templates:/templates:ro
    networks:
      - minio

  krakend:
    profiles: ["backend"]
    image: krakend:latest
    volumes:
      - ./krakend_config:/etc/krakend
    networks:
      - api-gateway
      - reverse-proxy
    depends_on:
      crm-backend:
        condition: service_started
      allocation-key-generation:
        condition: service_started
      simulation-key:
        condition: service_started
      news-board:
        condition: service_started
      billing:
        condition: service_started
      keycloak:
        condition: service_started

  crm-backend:
    profiles: ["backend"]
    image: ghcr.io/optimce/crm-backend:main
    command: npm start
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MICROSERVICE_NAME=crm-backend
      - ALLOWED_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=80
      - IAM_SERVICE_NAME=KEYCLOAK
      - IAM_REALM=${AUTH_REALM}
      - IAM_REALM_NAME=${AUTH_REALM}
      - IAM_BASE_URL=${AUTH_INTERNAL_URL}
      - IAM_CLIENT_ID=optimce-backend
      - IAM_GRANT_TYPE=client_credentials
      - IAM_CLIENT_SECRET=${AUTH_CLIENT_SECRET}
      - STORAGE_SERVICE_NAME=S3
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_REGION=us-east-1
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - STORAGE_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT}
      - REMOTE_LOGGING=${REMOTE_LOGGING}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - DB_TYPE=postgres
      - DB_HOST=crm-database
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=${CRM_DB_PASSWORD}
      - DB_NAME=crm_db
      # Shared regulator registry. crm-backend fails fast (process.exit(1)) if this
      # path is unset or unreadable, so the mount below is mandatory.
      - REGULATORS_CONFIG_PATH=/app/reference/regulators.json
    volumes:
      - ./reference:/app/reference:ro
    networks:
      - api-gateway
      - crm
      - keycloak
      - minio
      - opentelemetry
    depends_on:
      crm-database:
        condition: service_healthy
      keycloak-healthcheck:
        condition: service_healthy
      minio:
        condition: service_started

  allocation-key-generation:
    profiles: ["backend"]
    image: ghcr.io/optimce/allocation-key-generation:main-prod
    restart: unless-stopped
    environment:
      - ENV=production
      - CRM_DATABASE_URL=postgresql+asyncpg://postgres:${CRM_DB_PASSWORD}@crm-database:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://postgres:${ALLOCATION_KEY_DB_PASSWORD}@allocation-key-db:5432/allocation_key_local
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - STORAGE_REGION=us-east-1
      - LOGGING_TOKEN=${LOGGING_TOKEN}
      - LOGGING_TRACES_URL=${LOGGING_TRACES_URL}
      - LOGGING_LOGS_URL=${LOGGING_LOGS_URL}
      - LOGGING_METRICS_URL=${LOGGING_METRICS_URL}
    networks:
      - api-gateway
      - crm
      - allocation-key
      - nats
      - minio
      - opentelemetry
    depends_on:
      crm-database:
        condition: service_healthy
      allocation-key-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_started

  allocation-key-generation-worker:
    profiles: ["backend"]
    image: ghcr.io/optimce/allocation-key-generation:main-worker
    restart: unless-stopped
    cpus: "2.0"
    environment:
      - ENV=production
      - CRM_DATABASE_URL=postgresql+asyncpg://postgres:${CRM_DB_PASSWORD}@crm-database:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://postgres:${ALLOCATION_KEY_DB_PASSWORD}@allocation-key-db:5432/allocation_key_local
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - STORAGE_REGION=us-east-1
      - LOGGING_TOKEN=${LOGGING_TOKEN}
      - LOGGING_TRACES_URL=${LOGGING_TRACES_URL}
      - LOGGING_LOGS_URL=${LOGGING_LOGS_URL}
      - LOGGING_METRICS_URL=${LOGGING_METRICS_URL}
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    networks:
      - crm
      - allocation-key
      - nats
      - minio
      - opentelemetry
    depends_on:
      crm-database:
        condition: service_healthy
      allocation-key-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_started

  simulation-key:
    profiles: ["backend"]
    image: ghcr.io/optimce/allocation-key-simulation:main-prod
    restart: unless-stopped
    environment:
      - ENV=production
      - CRM_DATABASE_URL=postgresql+asyncpg://postgres:${CRM_DB_PASSWORD}@crm-database:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://postgres:${SIMULATION_KEY_DB_PASSWORD}@simulation-key-db:5432/simulation_key_local
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - STORAGE_REGION=us-east-1
      - LOGGING_TOKEN=${LOGGING_TOKEN}
      - LOGGING_TRACES_URL=${LOGGING_TRACES_URL}
      - LOGGING_LOGS_URL=${LOGGING_LOGS_URL}
      - LOGGING_METRICS_URL=${LOGGING_METRICS_URL}
    networks:
      - api-gateway
      - crm
      - simulation-key
      - nats
      - minio
      - opentelemetry
    depends_on:
      crm-database:
        condition: service_healthy
      simulation-key-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_started

  simulation-key-worker:
    profiles: ["backend"]
    image: ghcr.io/optimce/allocation-key-simulation:main-worker
    restart: unless-stopped
    cpus: "2.0"
    environment:
      - ENV=production
      - CRM_DATABASE_URL=postgresql+asyncpg://postgres:${CRM_DB_PASSWORD}@crm-database:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://postgres:${SIMULATION_KEY_DB_PASSWORD}@simulation-key-db:5432/simulation_key_local
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - STORAGE_REGION=us-east-1
      - LOGGING_TOKEN=${LOGGING_TOKEN}
      - LOGGING_TRACES_URL=${LOGGING_TRACES_URL}
      - LOGGING_LOGS_URL=${LOGGING_LOGS_URL}
      - LOGGING_METRICS_URL=${LOGGING_METRICS_URL}
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    networks:
      - crm
      - simulation-key
      - nats
      - minio
      - opentelemetry
    depends_on:
      crm-database:
        condition: service_healthy
      simulation-key-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_started

  news-board:
    profiles: ["backend"]
    image: ghcr.io/optimce/news-board:main-prod
    restart: unless-stopped
    environment:
      - ENV=production
      - CRM_DATABASE_URL=postgresql+asyncpg://postgres:${CRM_DB_PASSWORD}@crm-database:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://postgres:${NEWS_BOARD_DB_PASSWORD}@news-board-db:5432/news_board_local
      - ALLOW_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
      - LOGGING_TOKEN=${LOGGING_TOKEN}
      - LOGGING_TRACES_URL=${LOGGING_TRACES_URL}
      - LOGGING_LOGS_URL=${LOGGING_LOGS_URL}
      - LOGGING_METRICS_URL=${LOGGING_METRICS_URL}
    networks:
      - api-gateway
      - crm
      - news-board
      - opentelemetry
    depends_on:
      crm-database:
        condition: service_healthy
      news-board-db:
        condition: service_healthy

  # Stateless PDF renderer. Owns the DOCGEN_REQUESTS / DOCGEN_RESULTS / DOCGEN_DLQ
  # JetStream streams. Do NOT set any DOCGEN_* variable here: this service calls
  # add_stream() without a drift reconcile, so a stream that already exists with a
  # different subject/retention makes it boot-loop with an opaque JetStream error.
  document-generation:
    profiles: ["backend"]
    image: ghcr.io/optimce/document-generation:main-worker
    restart: unless-stopped
    environment:
      - ENV=production
      - NATS_URL=nats://nats:4222
      - STORAGE_ENDPOINT=http://minio:9000
      - TEMPLATES_BUCKET=${TEMPLATES_BUCKET}
      - OUTPUT_BUCKET=${OUTPUT_BUCKET}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - STORAGE_REGION=us-east-1
      - LOGGING_TOKEN=${LOGGING_TOKEN}
      - LOGGING_TRACES_URL=${LOGGING_TRACES_URL}
      - LOGGING_LOGS_URL=${LOGGING_LOGS_URL}
      - LOGGING_METRICS_URL=${LOGGING_METRICS_URL}
    networks:
      - nats
      - minio
      - opentelemetry
    depends_on:
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  billing:
    profiles: ["backend"]
    image: ghcr.io/optimce/billing:main-prod
    restart: unless-stopped
    environment:
      - ENV=production
      - CRM_DATABASE_URL=postgresql+asyncpg://postgres:${CRM_DB_PASSWORD}@crm-database:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://postgres:${BILLING_DB_PASSWORD}@billing-db:5432/billing_local
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - TEMPLATES_BUCKET=${TEMPLATES_BUCKET}
      - OUTPUT_BUCKET=${OUTPUT_BUCKET}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - STORAGE_REGION=us-east-1
      # Startup asserts parity between the active regulators here and the billing
      # regimes bundled in the image; a missing file crashes the container.
      - REGULATORS_CONFIG_PATH=/app/reference/regulators.json
      - DEFAULT_LOCALE=fr-BE
      - LOGGING_TOKEN=${LOGGING_TOKEN}
      - LOGGING_TRACES_URL=${LOGGING_TRACES_URL}
      - LOGGING_LOGS_URL=${LOGGING_LOGS_URL}
      - LOGGING_METRICS_URL=${LOGGING_METRICS_URL}
    volumes:
      - ./reference:/app/reference:ro
    networks:
      - api-gateway
      - crm
      - billing
      - nats
      - minio
      - opentelemetry
    depends_on:
      crm-database:
        condition: service_healthy
      billing-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  billing-worker:
    profiles: ["backend"]
    image: ghcr.io/optimce/billing:main-worker
    restart: unless-stopped
    environment:
      - ENV=production
      - CRM_DATABASE_URL=postgresql+asyncpg://postgres:${CRM_DB_PASSWORD}@crm-database:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://postgres:${BILLING_DB_PASSWORD}@billing-db:5432/billing_local
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - TEMPLATES_BUCKET=${TEMPLATES_BUCKET}
      - OUTPUT_BUCKET=${OUTPUT_BUCKET}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - STORAGE_REGION=us-east-1
      - REGULATORS_CONFIG_PATH=/app/reference/regulators.json
      - DEFAULT_LOCALE=fr-BE
      - LOGGING_TOKEN=${LOGGING_TOKEN}
      - LOGGING_TRACES_URL=${LOGGING_TRACES_URL}
      - LOGGING_LOGS_URL=${LOGGING_LOGS_URL}
      - LOGGING_METRICS_URL=${LOGGING_METRICS_URL}
    volumes:
      - ./reference:/app/reference:ro
    networks:
      - crm
      - billing
      - nats
      - minio
      - opentelemetry
    depends_on:
      crm-database:
        condition: service_healthy
      billing-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # Start docgen first so its DOCGEN_RESULTS stream usually exists before we
      # subscribe. The background subscribe-retry in worker/dispatcher.py is the
      # real guarantee, but it gives up after ~20 min and then silently disables
      # PDF attach for the lifetime of the process.
      document-generation:
        condition: service_started

  # ============================================
  # MIGRATION PROFILE - CRM schema migrations
  # ============================================
  optimce-migrator:
    profiles: ["migration"]
    image: ghcr.io/optimce/migrator:main
    restart: "no"
    environment:
      - OPTIMCE_CRM_DATABASE_URL=postgresql+asyncpg://postgres:${CRM_DB_PASSWORD}@crm-database:5432/crm_db
    networks:
      - crm
    depends_on:
      crm-database:
        condition: service_healthy

  # ============================================
  # FRONTEND PROFILE - Web serving
  # ============================================
  reverse-proxy:
    profiles: ["frontend"]
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
    networks:
      - reverse-proxy
      - minio
      - api-gateway
      - keycloak
      - crm

  certbot:
    profiles: ["frontend"]
    image: certbot/certbot:latest
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/certbot-webroot:/webroot
    command: certonly --webroot -w /webroot -d ${DOMAIN_HOST} --agree-tos -m ${SSL_EMAIL} --non-interactive
    environment:
      - DOMAIN_HOST=${DOMAIN_HOST}
      - SSL_EMAIL=${SSL_EMAIL}

  crm-frontend:
    profiles: ["frontend"]
    image: ghcr.io/optimce/crm-frontend:main
    volumes:
      - ./crm-frontend-config/config.json:/usr/share/nginx/html/assets/config/config.json
    networks:
      - reverse-proxy

  # ============================================
  # BACKUP PROFILE - Database backups
  # ============================================
  crm-database-backup:
    profiles: ["backup"]
    image: postgres:18-alpine
    volumes:
      - ./backups:/backups
    environment:
      - PGPASSWORD=${CRM_DB_PASSWORD}
    command: >
      sh -c '
        timestamp=$$(date +%Y%m%d_%H%M%S);
        tmp=/backups/crm_db_$${timestamp}.sql.tmp;
        output=/backups/crm_db_$${timestamp}.sql;
        trap "rm -f \"$$tmp\"" EXIT;
        pg_dump -h crm-database -U postgres -d crm_db -f "$$tmp";
        mv "$$tmp" "$$output";
      '
    networks:
      - crm

  keycloak-db-backup:
    profiles: ["backup"]
    image: postgres:18-alpine
    volumes:
      - ./backups:/backups
    environment:
      - PGPASSWORD=${KEYCLOAK_DB_PASSWORD}
    command: >
      sh -c '
        timestamp=$$(date +%Y%m%d_%H%M%S);
        tmp=/backups/keycloak_$${timestamp}.sql.tmp;
        output=/backups/keycloak_$${timestamp}.sql;
        trap "rm -f \"$$tmp\"" EXIT;
        pg_dump -h keycloak-db -U postgres -d keycloak -f "$$tmp";
        mv "$$tmp" "$$output";
      '
    networks:
      - keycloak

  allocation-key-db-backup:
    profiles: ["backup"]
    image: postgres:18-alpine
    volumes:
      - ./backups:/backups
    environment:
      - PGPASSWORD=${ALLOCATION_KEY_DB_PASSWORD}
    command: >
      sh -c '
        timestamp=$$(date +%Y%m%d_%H%M%S);
        tmp=/backups/allocation_key_$${timestamp}.sql.tmp;
        output=/backups/allocation_key_$${timestamp}.sql;
        trap "rm -f \"$$tmp\"" EXIT;
        pg_dump -h allocation-key-db -U postgres -d allocation_key_local -f "$$tmp";
        mv "$$tmp" "$$output";
      '
    networks:
      - allocation-key

  simulation-key-db-backup:
    profiles: ["backup"]
    image: postgres:18-alpine
    volumes:
      - ./backups:/backups
    environment:
      - PGPASSWORD=${SIMULATION_KEY_DB_PASSWORD}
    command: >
      sh -c '
        timestamp=$$(date +%Y%m%d_%H%M%S);
        tmp=/backups/simulation_key_$${timestamp}.sql.tmp;
        output=/backups/simulation_key_$${timestamp}.sql;
        trap "rm -f \"$$tmp\"" EXIT;
        pg_dump -h simulation-key-db -U postgres -d simulation_key_local -f "$$tmp";
        mv "$$tmp" "$$output";
      '
    networks:
      - simulation-key

  news-board-db-backup:
    profiles: ["backup"]
    image: postgres:18-alpine
    volumes:
      - ./backups:/backups
    environment:
      - PGPASSWORD=${NEWS_BOARD_DB_PASSWORD}
    command: >
      sh -c '
        timestamp=$$(date +%Y%m%d_%H%M%S);
        tmp=/backups/news_board_$${timestamp}.sql.tmp;
        output=/backups/news_board_$${timestamp}.sql;
        trap "rm -f \"$$tmp\"" EXIT;
        pg_dump -h news-board-db -U postgres -d news_board_local -f "$$tmp";
        mv "$$tmp" "$$output";
      '
    networks:
      - news-board

  billing-db-backup:
    profiles: ["backup"]
    image: postgres:18-alpine
    volumes:
      - ./backups:/backups
    environment:
      - PGPASSWORD=${BILLING_DB_PASSWORD}
    command: >
      sh -c '
        timestamp=$$(date +%Y%m%d_%H%M%S);
        tmp=/backups/billing_$${timestamp}.sql.tmp;
        output=/backups/billing_$${timestamp}.sql;
        trap "rm -f \"$$tmp\"" EXIT;
        pg_dump -h billing-db -U postgres -d billing_local -f "$$tmp";
        mv "$$tmp" "$$output";
      '
    networks:
      - billing

  backup-upload:
    profiles: ["backup"]
    image: rclone/rclone:latest
    volumes:
      - ./backups:/backups
    environment:
      - RCLONE_CONFIG_BACKUP_TYPE=s3
      - RCLONE_CONFIG_BACKUP_PROVIDER=Other
      - RCLONE_CONFIG_BACKUP_ENDPOINT=${BACKUP_S3_ENDPOINT}
      - RCLONE_CONFIG_BACKUP_REGION=${BACKUP_S3_REGION}
      - RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID=${BACKUP_S3_ACCESS_KEY}
      - RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY=${BACKUP_S3_SECRET_KEY}
      - RCLONE_CONFIG_BACKUP_FORCE_PATH_STYLE=${BACKUP_S3_FORCE_PATH_STYLE}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET}
      - BACKUP_S3_PREFIX=${BACKUP_S3_PREFIX}
    command: >
      sh -c '
        set -eu;
        rclone copy /backups "backup:$${BACKUP_S3_BUCKET}/$${BACKUP_S3_PREFIX}" --include "*.sql";
        rclone check /backups "backup:$${BACKUP_S3_BUCKET}/$${BACKUP_S3_PREFIX}" --include "*.sql" --one-way;
        for file in /backups/*.sql; do
          [ -e "$$file" ] || continue;
          rm -- "$$file";
        done;
      '

volumes:
  crm_db_data:
  keycloak_db_data:
  allocation_key_db_data:
  simulation_key_db_data:
  news_board_db_data:
  billing_db_data:
  minio_data:
  nats_data:
  krakend_config:
  keycloak_data:

networks:
  reverse-proxy:
  api-gateway:
  crm:
  keycloak:
  allocation-key:
  simulation-key:
  news-board:
  billing:
  nats:
  minio:
  opentelemetry:

services:
  # ============================================
  # INIT PROFILE - Configuration generation
  # ============================================
  swagger-doc-gen:
    profiles: ["init"]
    image: alpine/curl:latest
    command:
      - "-fL"
      - "https://optimce.github.io/crm-backend/swagger.yml"
      - "-o"
      - "/data/root.yaml"
    volumes:
      - ./krakend_config:/data:z
    restart: on-failure

  generation-doc-gen:
    profiles: ["init"]
    image: alpine/curl:latest
    command:
      - "-fL"
      - "https://optimce.github.io/allocation-key-generation/swagger.yml"
      - "-o"
      - "/data/generation.json"
    volumes:
      - ./krakend_config:/data:z
    restart: on-failure

  simulation-doc-gen:
    profiles: ["init"]
    image: alpine/curl:latest
    command:
      - "-fL"
      - "https://optimce.github.io/allocation-key-simulation/swagger.yml"
      - "-o"
      - "/data/simulation.json"
    volumes:
      - ./krakend_config:/data:z
    restart: on-failure

  news-board-doc-gen:
    profiles: ["init"]
    image: alpine/curl:latest
    command:
      - "-fL"
      - "https://optimce.github.io/news-board/swagger.yml"
      - "-o"
      - "/data/news-board.json"
    volumes:
      - ./krakend_config:/data:z
    restart: on-failure

  billing-doc-gen:
    profiles: ["init"]
    image: alpine/curl:latest
    command:
      - "-fL"
      - "https://optimce.github.io/billing/swagger.yml"
      - "-o"
      - "/data/billing.json"
    volumes:
      - ./krakend_config:/data:z
    restart: on-failure

  administrative-document-doc-gen:
    profiles: ["init"]
    image: alpine/curl:latest
    command:
      - "-fL"
      - "https://optimce.github.io/administrative-document/swagger.yml"
      - "-o"
      - "/data/administrative-document.json"
    volumes:
      - ./krakend_config:/data:z
    restart: on-failure

  krakend-config:
    profiles: ["init"]
    image: ghcr.io/optimce/swagger2krakend:main
    volumes:
      - ./krakend_config:/config
    environment:
      - CONFIG_FILE=/config/krakend-builder.yaml
      - OUTPUT_FILE=/config/krakend.json
      - KEYCLOAK_URL=${AUTH_INTERNAL_URL}
      - REALM_NAME=${AUTH_REALM}
      - ISSUER=${DOMAIN}${WEB_AUTH_URL}/realms/${AUTH_REALM}
    restart: on-failure
    depends_on:
      swagger-doc-gen:
        condition: service_completed_successfully
      generation-doc-gen:
        condition: service_completed_successfully
      simulation-doc-gen:
        condition: service_completed_successfully
      news-board-doc-gen:
        condition: service_completed_successfully
      billing-doc-gen:
        condition: service_completed_successfully
      administrative-document-doc-gen:
        condition: service_completed_successfully

  keycloak-config:
    profiles: ["init"]
    image: ghcr.io/ourouk/alpine-envsubst:main
    env_file:
      - .env
    volumes:
      - ./keycloak/realm:/config
    command:
      - < /config/prod-config.template.json > /config/prod-config.json

  nginx-config:
    profiles: ["init"]
    image: ghcr.io/ourouk/alpine-envsubst:main
    env_file:
      - .env
    volumes:
      - ./nginx/conf-template.d:/config
      - ./nginx/conf.d:/output
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        if [ "${USE_HTTPS}" = "true" ]; then
          cp /config/default-https.template.conf /tmp/template.conf;
        else
          cp /config/default-http.template.conf /tmp/template.conf;
        fi
        envsubst < /tmp/template.conf | sed 's/§/$/g' > /output/default.conf

  crm-frontend-config:
    profiles: ["init"]
    image: ghcr.io/ourouk/alpine-envsubst:main
    env_file:
      - .env
    volumes:
      - ./crm-frontend-config:/config
    command:
      - < /config/config.template.json > /config/config.json


  keycloak-group-id-mapper:
    profiles: ["init"]
    image: alpine/curl:latest
    command:
      - "-fL"
      - "https://github.com/OptimCE/kc-groupid-mapper/releases/download/v0.0.1/kc-groupid-mapper-1.0.0.jar"
      - "-o"
      - "/data/kc-groupid-mapper-1.0.0.jar"
    volumes:
      - ./keycloak/providers:/data:z
    restart: on-failure

  keycloak-optimce-theme:
    profiles: ["init"]
    image: alpine:3.20
    entrypoint: /bin/sh
    working_dir: /data
    volumes:
      - ./keycloak/providers:/data:z
    command:
      - "-c"
      - |
        set -eu
        apk add --no-cache curl unzip zip >/dev/null
        WORK=$$(mktemp -d)
        JAR=/data/keycloak-theme-for-kc-all-other-versions.jar
        curl -fsSL \
          https://github.com/OptimCE/optimce-keycloak-theme/releases/download/v0.0.3/keycloak-theme-for-kc-all-other-versions.jar \
          -o "$$WORK/src.jar"
        mkdir -p "$$WORK/unpacked"
        cd "$$WORK/unpacked"
        unzip -o "$$WORK/src.jar" >/dev/null
        if [ -d theme/keycloakify-starter ] && [ ! -d theme/optimce ]; then
          mv theme/keycloakify-starter theme/optimce
        fi
        mkdir -p META-INF
        echo '{"themes":[{"name":"optimce","types":["login"]}]}' > META-INF/keycloak-themes.json
        rm -f "$$JAR"
        zip -r "$$JAR" META-INF theme >/dev/null
        rm -rf "$$WORK"
    restart: on-failure
  # ============================================
  # BACKEND PROFILE - Databases and runtime
  # ============================================
  # ONE Postgres instance holds every application database: crm_db,
  # allocation_key_local, simulation_key_local, news_board_local, billing_local,
  # administrative_document_local. Each has its own login role and its own
  # password, and PUBLIC cannot connect to any of them. Provisioning lives in
  # ./postgres — read postgres/README.md before changing anything here.
  #
  # `keycloak-db` below is deliberately NOT consolidated: Keycloak manages its
  # own schema at startup and is the one service whose failure locks everyone out
  # of everything, so it stays outside this instance's blast radius. These five
  # roles have no network route to it at all.
  postgres:
    profiles: ["backend"]
    image: postgres:18-alpine@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
    restart: unless-stopped
    # max_connections is derived from the pool variables pinned on every
    # consumer below, not guessed:
    #
    #   9 two-pool Python processes x (CRM 5+5 + LOCAL 5+5) = 180
    #   notification-dispatch (CRM pool only, 5+5)          =  10
    #   crm-backend (node-postgres pool)                    =  10
    #   migrator + postgres-init + backup + admin           = ~10
    #                                                         ---
    #                                                         210
    #
    # The coded default in each Python service is POOL_SIZE=20 + MAX_OVERFLOW=10
    # — 60 per two-pool process, 540 for the nine. Spread over six instances that
    # ceiling was never met; one instance meets all of it at once. The
    # CRM_DB_POOL_SIZE / LOCAL_DB_POOL_SIZE lines below are therefore load
    # bearing, not tuning.
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=${POSTGRES_SUPERUSER_PASSWORD}
      # postgres:18 moved the image default to /var/lib/postgresql/18/docker.
      # This override and the volume mount point below must stay PAIRED, or the
      # server silently initialises an empty cluster beside the real data.
      - PGDATA=/var/lib/postgresql/data
    # Parallel query allocates dynamic shared memory in /dev/shm; Docker's 64 MB
    # default surfaces as "could not resize shared memory segment".
    shm_size: 256mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      # -h localhost forces a TCP probe. The image entrypoint's bootstrap phase
      # runs a temporary server with listen_addresses='', so only TCP stays red
      # until the real server accepts — which is what makes `service_healthy`
      # meaningful for the sidecar below.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Converges roles, passwords, databases, schema ownership, CONNECT ACLs and the
  # CRM grant matrix on every `up`, then exits 0. Every database consumer gates on
  # that exit code, so the stack cannot come up with half its grants — which
  # matters because a missing CRM grant produces no application error at all.
  #
  # No `restart:` policy on purpose: a container that restarts never "completes",
  # and `service_completed_successfully` would never be satisfied.
  postgres-init:
    profiles: ["backend"]
    image: postgres:18-alpine@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGDATABASE=postgres
      - PGPASSWORD=${POSTGRES_SUPERUSER_PASSWORD}
      - CRM_DB_PASSWORD=${CRM_DB_PASSWORD}
      - ALLOCATION_KEY_DB_PASSWORD=${ALLOCATION_KEY_DB_PASSWORD}
      - SIMULATION_KEY_DB_PASSWORD=${SIMULATION_KEY_DB_PASSWORD}
      - NEWS_BOARD_DB_PASSWORD=${NEWS_BOARD_DB_PASSWORD}
      - BILLING_DB_PASSWORD=${BILLING_DB_PASSWORD}
      - ADMINISTRATIVE_DOCUMENT_DB_PASSWORD=${ADMINISTRATIVE_DOCUMENT_DB_PASSWORD}
      # notification-dispatch owns no database; this password is for a role that
      # exists solely to hold narrow write grants on crm_db.
      - NOTIFICATION_DISPATCH_DB_PASSWORD=${NOTIFICATION_DISPATCH_DB_PASSWORD}
    entrypoint: ["/bin/sh", "/postgres/provision/provision.sh"]
    volumes:
      - ./postgres:/postgres:ro
      # Mounted by DATABASE name, never by repo path. That is what lets the same
      # provision.sh run unchanged during the migration, around pg_restore.
      # These are disaster-recovery baselines, applied only to an empty database.
      - ./schemas/crm_db.sql:/schemas/crm_db.sql:ro
      - ./schemas/allocation_key_local.sql:/schemas/allocation_key_local.sql:ro
      - ./schemas/simulation_key_local.sql:/schemas/simulation_key_local.sql:ro
      - ./schemas/news_board_local.sql:/schemas/news_board_local.sql:ro
      - ./schemas/billing_local.sql:/schemas/billing_local.sql:ro
      - ./schemas/administrative_document_local.sql:/schemas/administrative_document_local.sql:ro
    networks:
      - database

  keycloak-db:
    profiles: ["backend"]
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - keycloak
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nats:
    profiles: ["backend"]
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222", "-sd", "/data"]
    volumes:
      - nats_data:/data
    networks:
      - nats
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - 'http://localhost:8222/healthz?js-enabled-only=true' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  keycloak:
    profiles: ["backend"]
    image: quay.io/keycloak/keycloak:26.5.5@sha256:a7b0cb7a43a1235a61872883414d3f1d9a3ceac9df6e5907bd12202778a6265c
    restart: unless-stopped
    command:
      - "start"
      - "--import-realm"
      - "--health-enabled=true"
      - "--metrics-enabled=true"
      - "--proxy-headers=xforwarded"
      - "--http-relative-path=/keycloak"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      - KEYCLOAK_IMPORT=/opt/keycloak/data/import/prod-config.json
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_HOSTNAME=${KEYCLOAK_HOSTNAME}
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    volumes:
      - ./keycloak/realm/prod-config.json:/opt/keycloak/data/import/prod-config.json
      - ./keycloak/providers:/opt/keycloak/providers/
    networks:
      - keycloak
      - api-gateway
      - reverse-proxy
    depends_on:
      keycloak-db:
        condition: service_healthy



  keycloak-healthcheck:
    profiles: ["backend"]
    image: alpine/curl
    command: ["tail", "-f", "/dev/null"]
    networks:
      - keycloak
    depends_on:
      - keycloak
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --head -fsS http://keycloak:9000/keycloak/health/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  minio:
    profiles: ["backend"]
    image: pgsty/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_SERVER_ADDRESS=:9000
    volumes:
      - minio_data:/data
    networks:
      - reverse-proxy
      - minio
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    profiles: ["backend"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - TEMPLATES_BUCKET=${TEMPLATES_BUCKET}
      - OUTPUT_BUCKET=${OUTPUT_BUCKET}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${STORAGE_BUCKET};
      mc mb --ignore-existing local/$${TEMPLATES_BUCKET};
      mc mb --ignore-existing local/$${OUTPUT_BUCKET};
      mc cp --recursive /templates/billing local/$${TEMPLATES_BUCKET}/;
      mc cp --recursive /templates/administrative-document local/$${TEMPLATES_BUCKET}/;
      exit 0;
      "
    volumes:
      - ./document-templates:/templates:ro
    networks:
      - minio

  krakend:
    profiles: ["backend"]
    image: krakend:latest
    volumes:
      - ./krakend_config:/etc/krakend
    networks:
      - api-gateway
      - reverse-proxy
    depends_on:
      crm-backend:
        condition: service_started
      allocation-key-generation:
        condition: service_started
      simulation-key:
        condition: service_started
      news-board:
        condition: service_started
      billing:
        condition: service_started
      administrative-document:
        condition: service_started
      keycloak:
        condition: service_started

  crm-backend:
    profiles: ["backend"]
    image: ghcr.io/optimce/crm-backend:main
    command: npm start
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MICROSERVICE_NAME=crm-backend
      - ALLOWED_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=80
      - IAM_SERVICE_NAME=KEYCLOAK
      - IAM_REALM=${AUTH_REALM}
      - IAM_REALM_NAME=${AUTH_REALM}
      - IAM_BASE_URL=${AUTH_INTERNAL_URL}
      - IAM_CLIENT_ID=optimce-backend
      - IAM_GRANT_TYPE=client_credentials
      - IAM_CLIENT_SECRET=${AUTH_CLIENT_SECRET}
      - STORAGE_SERVICE_NAME=S3
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_REGION=us-east-1
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - STORAGE_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT}
      - REMOTE_LOGGING=${REMOTE_LOGGING}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      # crm-backend is the only consumer using discrete variables — its TypeORM
      # DataSource has no `url:` option. It owns crm_db and every object in it.
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=crm_svc
      - DB_PASSWORD=${CRM_DB_PASSWORD}
      - DB_NAME=crm_db
      # Shared regulator registry. crm-backend fails fast (process.exit(1)) if this
      # path is unset or unreadable, so the mount below is mandatory.
      - REGULATORS_CONFIG_PATH=/app/reference/regulators.json
    volumes:
      - ./reference:/app/reference:ro
    networks:
      - api-gateway
      - crm
      - database
      - keycloak
      - minio
      - opentelemetry
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      keycloak-healthcheck:
        condition: service_healthy
      minio:
        condition: service_started

  allocation-key-generation:
    profiles: ["backend"]
    image: ghcr.io/optimce/allocation-key-generation:main-prod
    restart: unless-stopped
    environment:
      - ENV=production
      # Both DSNs connect as this service's OWN role. On crm_db that role holds
      # SELECT plus a handful of narrow INSERTs — see postgres/README.md.
      - CRM_DATABASE_URL=postgresql+asyncpg://allocation_key_svc:${ALLOCATION_KEY_DB_PASSWORD}@postgres:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://allocation_key_svc:${ALLOCATION_KEY_DB_PASSWORD}@postgres:5432/allocation_key_local
      # Not tuning. The coded default is 20+10 per pool; unpinned, the seven
      # Python processes alone ask for 420 backends off one instance.
      - CRM_DB_POOL_SIZE=5
      - CRM_DB_MAX_OVERFLOW=5
      - LOCAL_DB_POOL_SIZE=5
      - LOCAL_DB_MAX_OVERFLOW=5
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - STORAGE_REGION=us-east-1
      - LOGGING_TOKEN=${LOGGING_TOKEN}
      - LOGGING_TRACES_URL=${LOGGING_TRACES_URL}
      - LOGGING_LOGS_URL=${LOGGING_LOGS_URL}
      - LOGGING_METRICS_URL=${LOGGING_METRICS_URL}
    networks:
      - api-gateway
      - crm
      - database
      - allocation-key
      - nats
      - minio
      - opentelemetry
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio:
        condition: service_started

  allocation-key-generation-worker:
    profiles: ["backend"]
    image: ghcr.io/optimce/allocation-key-generation:main-worker
    restart: unless-stopped
    cpus: "2.0"
    environment:
      - ENV=production
      - CRM_DATABASE_URL=postgresql+asyncpg://allocation_key_svc:${ALLOCATION_KEY_DB_PASSWORD}@postgres:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://allocation_key_svc:${ALLOCATION_KEY_DB_PASSWORD}@postgres:5432/allocation_key_local
      - CRM_DB_POOL_SIZE=5
      - CRM_DB_MAX_OVERFLOW=5
      - LOCAL_DB_POOL_SIZE=5
      - LOCAL_DB_MAX_OVERFLOW=5
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - STORAGE_REGION=us-east-1
      - LOGGING_TOKEN=${LOGGING_TOKEN}
      - LOGGING_TRACES_URL=${LOGGING_TRACES_URL}
      - LOGGING_LOGS_URL=${LOGGING_LOGS_URL}
      - LOGGING_METRICS_URL=${LOGGING_METRICS_URL}
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    networks:
      - crm
      - database
      - allocation-key
      - nats
      - minio
      - opentelemetry
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio:
        condition: service_started

  simulation-key:
    profiles: ["backend"]
    image: ghcr.io/optimce/allocation-key-simulation:main-prod
    restart: unless-stopped
    environment:
      - ENV=production
      - CRM_DATABASE_URL=postgresql+asyncpg://simulation_key_svc:${SIMULATION_KEY_DB_PASSWORD}@postgres:5432/crm_db
      - LOCAL_DATABASE_URL=postgresql+asyncpg://simulation_key_svc:${SIMULATION_KEY_DB_PASSWORD}@postgres:5432/simulation_key_local
      - CRM_DB_POOL_SIZE=5
      - CRM_DB_MAX_OVERFLOW=5
      - LOCAL_DB_POOL_SIZE=5
      - LOCAL_DB_MAX_OVERFLOW=5
      - NATS_URL=nats://nats:4222
      - ALLOW_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - STORAGE_REGION=us-east-1
      - LOGGING_TOKEN=${LOGGING_TOKEN}
      - LOGGING_TRACES_URL=${LOGGING_TRACES_URL}
      - LOGGING_LOGS_URL=${LOGGING_LOGS_URL}
      - LOGGING_METRICS_URL=${LOGGING_METRICS_URL}
    networks:
      - api-gateway
      - crm
      - database
      - simulation-key
      - nats
      - minio
      - opentelemetry
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio:
        condition: service_started

  simulation-key-worker:

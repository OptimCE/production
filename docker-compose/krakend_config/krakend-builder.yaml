global:
  extra_config: /app/extra-config.json
  # Every other endpoint keeps the generator's 3000ms. The upload and
  # file-download endpoints (multipart bodies, non-JSON responses: consumption
  # import, document/logo uploads, xlsx/pdf exports...) get this instead,
  # because their backend time grows with the file: importing one month of RESA
  # readings takes ~1.3 s for 5 meters and ~26 s for 100 (measured on the dev
  # machine, 2026-10-06). At 3000ms the gateway answered 500 "context deadline
  # exceeded" while crm-backend went on to commit the import, so the SPA
  # reported a failure for data that was saved.
  # Keep it under nginx's 60 s proxy_read_timeout on /api/, so that an expiry
  # is reported by the gateway rather than by nginx.
  # Needs a swagger2krakend image built from d4a8f0a (2026-07-26) or later; an
  # older one ignores this key without a word, so check krakend.json, not this.
  stream_timeout: 50s

services:
  root:
    swagger: /config/root.yaml
    host: crm-backend:80
  generation:
    swagger: /config/generation.json
    host: allocation-key-generation:8002
  simulation:
    swagger: /config/simulation.json
    host: simulation-key:8000
  news:
    swagger: /config/news-board.json
    host: news-board:8000
  billing:
    swagger: /config/billing.json
    host: billing:8000
  administrative-document:
    swagger: /config/administrative-document.json
    host: administrative-document:8000

  # ---- live-data: ONE service, TWO entries ----------------------------------
  #
  # The JWT validator is gated PER SERVICE ENTRY, never per endpoint, so a
  # service with one public route among authenticated ones cannot be one entry.
  # Hence two keys on the same host, backed by the two DISJOINT swagger files
  # that live-data-doc-gen downloads (docker-compose.yml).
  #
  # THE KEYS ARE THE NAMESPACE: the generator mounts every service but `root` at
  # `/<key>`, so these must stay literally `live` and `live-public`. The frozen
  # device protocol says `/live-public/enroll`, and `live-data` as a key would
  # move it. No `prefix:` on either (decision D-2): the subtrees are disjoint by
  # construction, so a (path, method) collision — which panics the gateway and
  # takes every other endpoint down with it — cannot happen between them.
  #
  # The host need not resolve when the live-data profile is not running: KrakenD
  # resolves it per request, so only these routes fail until it does.
  live:
    swagger: /config/live.json
    host: live-data:8000

  live-public:
    swagger: /config/live-public.json
    host: live-data:8000
    # THE PLATFORM'S ONLY UNAUTHENTICATED SERVICE ENTRY. It does NOT strip the
    # x-user-* headers (`input_headers` is global in the generator): nginx's
    # `location = /api/live-public/enroll` blanks them, and live-data's own
    # tests/test_public_surface.py is the second lock.
    auth: false

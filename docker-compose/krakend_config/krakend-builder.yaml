global:
  extra_config: /app/extra-config.json
  # Every other endpoint keeps the generator's 3000ms. The upload and
  # file-download endpoints (multipart bodies, non-JSON responses: consumption
  # import, document/logo uploads, xlsx/pdf exports...) get this instead,
  # because their backend time grows with the file: importing one month of RESA
  # readings takes ~1.3 s for 5 meters and ~26 s for 100 (measured on the dev
  # machine, 2026-10-06). At 3000ms the gateway answered 500 "context deadline
  # exceeded" while crm-backend went on to commit the import, so the SPA
  # reported a failure for data that was saved.
  # Keep it under nginx's 60 s proxy_read_timeout on /api/, so that an expiry
  # is reported by the gateway rather than by nginx.
  # Needs a swagger2krakend image built from d4a8f0a (2026-07-26) or later; an
  # older one ignores this key without a word, so check krakend.json, not this.
  stream_timeout: 50s

services:
  root:
    swagger: /config/root.yaml
    host: crm-backend:80
  generation:
    swagger: /config/generation.json
    host: allocation-key-generation:8002
  simulation:
    swagger: /config/simulation.json
    host: simulation-key:8000
  news:
    swagger: /config/news-board.json
    host: news-board:8000
  billing:
    swagger: /config/billing.json
    host: billing:8000
  administrative-document:
    swagger: /config/administrative-document.json
    host: administrative-document:8000
